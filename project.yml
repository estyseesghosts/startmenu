name: MacStartLauncher
options:
  bundleIdPrefix: com.startmenu
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""

targets:
  MacStartLauncher:
    type: application
    platform: macOS
    sources:
      - path: MacStartLauncher
    settings:
      base:
        PRODUCT_NAME: MacStartLauncher
        PRODUCT_BUNDLE_IDENTIFIER: com.startmenu.MacStartLauncher
        INFOPLIST_FILE: MacStartLauncher/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies: []

  MacStartLauncherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacStartLauncherTests
    dependencies:
      - target: MacStartLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.startmenu.MacStartLauncherTests
        GENERATE_INFOPLIST_FILE: YES

  MacStartLauncherUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacStartLauncherUITests
    dependencies:
      - target: MacStartLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.startmenu.MacStartLauncherUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacStartLauncher:
    build:
      targets:
        MacStartLauncher: all
        MacStartLauncherTests: [test]
        MacStartLauncherUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MacStartLauncherTests
        - MacStartLauncherUITests
